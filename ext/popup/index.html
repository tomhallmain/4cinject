<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body>

		<h1>4CInject</h1>

		<p>Select from the below options to interact with the page.</p>

		<div class="btn-group" style="width:100%">
			<button type="button" class="expand" style="width:33.33%">
				Expand
			</button>
			<button type="button" class="close" style="width:33.33%">
				Close
			</button>
			<button type="button" class="autoExpand" style="width:33.33%">
				Auto Expand
			</button>
		</div>

		<div class="btn-group" style="width:100%">
			<button type="button" class="digits" style="width:50%">
				Digits
			</button>
			<button type="button" class="maxDigits" style="width:50%">
				MaxDigits
			</button>
		</div>

		<div class="btn-group" style="width:100%">
			<button type="button" class="threadGraph" style="width:25%">
				Thread<br>Graph
			</button>
			<button type="button" class="subthreads" style="width:25%">
				Reveal Subthreads
			</button>
			<button type="button" class="contentExtract" style="width:25%">
				Extract Content
			</button>
			<button type="button" class="toggleTestHash" style="width:25%">
				Test Hash
			</button>
		</div>

		<div class="btn-group" style="width:100%">
			<button type="button" class="fullScreen" style="width:33.33%">
				Full Screen
			</button>
			<button type="button" class="catalogFilter" style="width:33.33%">
				Catalog Filter
			</button>
			<button type="button" class="highlightNew" style="width:33.33%">
				Highlight New
			</button>
		</div>

		<br>

		<div>
			<p>Set Audio Volume:</p>
			<div class="slidecontainer">
				<input type="range" min="1" max="100" value="50" class="slider" id="volume">
			</div>
		</div>

		<br>

		<p>Set Thread Filters (one regex per line, saved when the box loses focus):</p>
		<textarea placeholder="YLYL" class="threadFilter" id="threadFilter" rows=4 cols="50"></textarea>
		<p class="status" id="threadFilterStatus" role="status"></p>

		<p>Set Post Text Transforms:</p>
		<textarea placeholder="regex1==replacement1&#10;regex2==replacement2" class="textTransforms" id="textTransforms" rows=4 cols="50"></textarea>

		<p>Edit Content Filter (one hash per line):</p>
		<textarea placeholder="Loading..." class="contentFilter" id="contentFilter" rows=4 cols="50"></textarea>

		<div class="btn-group" style="width:100%">
			<button type="button" id="contentFilterSave" style="width:50%" disabled>
				Save Content Filter
			</button>
			<button type="button" id="contentFilterRestore" style="width:50%" disabled>
				Load Previous Version
			</button>
		</div>

		<div class="confirm" id="contentFilterConfirm" hidden>
			<p id="contentFilterSummary"></p>
			<div id="contentFilterTyped" hidden>
				<label for="contentFilterTypedInput" id="contentFilterTypedLabel"></label>
				<input type="text" id="contentFilterTypedInput" inputmode="numeric" autocomplete="off">
			</div>
			<div class="btn-group" style="width:100%">
				<button type="button" id="contentFilterConfirmButton" style="width:50%">
					Confirm
				</button>
				<button type="button" id="contentFilterCancel" style="width:50%">
					Cancel
				</button>
			</div>
		</div>

		<p class="status" id="contentFilterStatus" role="status"></p>

		<button type="button" class="downloadFilteredHashes" style="width: 100%;">
			Download Content Filter (Hash)
		</button>

	</body>
</html>

<script type='text/javascript' src="../shared/actions.js"></script>
<script type='text/javascript' src="../shared/util.js"></script>
<script type='text/javascript' src="popup.js"></script>
